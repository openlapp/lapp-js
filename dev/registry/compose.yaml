name: openlapp-local-registry

services:
  registry:
    image: verdaccio/verdaccio:6.7.4
    container_name: openlapp-local-registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:4873:4873"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /verdaccio/conf/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: storage
        target: /verdaccio/storage
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4873/-/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  storage:
    name: openlapp-verdaccio-storage
