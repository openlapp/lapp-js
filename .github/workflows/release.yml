name: release

on:
  push:
    tags:
      - "v*"

defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          path: lapp-js
      - uses: actions/checkout@v4
        with:
          repository: openlapp/lapp
          ref: 29b0535acbe660a54bb782613495c040d1ea37ac
          path: lapp
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: lapp-js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: lapp-js
      - run: pnpm build
        working-directory: lapp-js
      - run: pnpm lint
        working-directory: lapp-js
      - run: pnpm test
        working-directory: lapp-js
      - if: matrix.node-version == 22
        run: pnpm coverage
        working-directory: lapp-js
      - if: matrix.node-version == 22
        run: npm ci
        working-directory: lapp
      - if: matrix.node-version == 22
        run: npm test
        working-directory: lapp
      - run: pnpm verify:docs
        working-directory: lapp-js
      - run: pnpm verify:spec
        working-directory: lapp-js
      - run: git diff --check
        working-directory: lapp-js

  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lapp-js
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lapp-js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: lapp-js
      - run: pnpm build
        working-directory: lapp-js
      - run: pnpm smoke:pack
        working-directory: lapp-js
      - run: git diff --check
        working-directory: lapp-js

  windows-vault:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          path: lapp-js
      - uses: actions/checkout@v4
        with:
          repository: openlapp/lapp
          ref: 29b0535acbe660a54bb782613495c040d1ea37ac
          path: lapp
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: lapp-js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: lapp-js
      - run: pnpm build
        working-directory: lapp-js
      - run: pnpm lint
        working-directory: lapp-js
      - run: pnpm test
        working-directory: lapp-js
      - run: pnpm verify:docs
        working-directory: lapp-js
      - run: pnpm verify:spec
        working-directory: lapp-js
      - run: pnpm test:vault:system
        working-directory: lapp-js
      - if: matrix.node-version == 22
        run: pnpm smoke:pack
        working-directory: lapp-js
      - run: git diff --check
        working-directory: lapp-js

  release:
    needs: [quality, pack-smoke, windows-vault]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: lapp-js
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lapp-js/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        working-directory: lapp-js

      - name: Verify committed version matches tag
        id: version
        working-directory: lapp-js
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          SDK_VERSION="$(node -p "require('./packages/lapp/package.json').version")"
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [[ "$TAG_VERSION" == 0.* ]]; then
            echo "0.x versions are internal-only and must use the loopback Registry without a Git tag"
            exit 1
          fi
          for manifest in packages/lapp/package.json packages/cli/package.json; do
            PUBLISH_REGISTRY="$(node -p "require('./${manifest}').publishConfig?.registry || ''")"
            if [[ "$PUBLISH_REGISTRY" != "https://registry.npmjs.org/" ]]; then
              echo "$manifest must target https://registry.npmjs.org/ before a public release (found: ${PUBLISH_REGISTRY:-unset})"
              exit 1
            fi
          done
          if [[ "$ROOT_VERSION" != "$TAG_VERSION" \
            || "$SDK_VERSION" != "$TAG_VERSION" \
            || "$CLI_VERSION" != "$TAG_VERSION" ]]; then
            echo "version mismatch: tag=$TAG_VERSION root=$ROOT_VERSION sdk=$SDK_VERSION cli=$CLI_VERSION"
            exit 1
          fi
          if [[ "$SDK_VERSION" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify npm authentication
        working-directory: lapp-js
        run: npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: pnpm build
        working-directory: lapp-js

      - name: Publish @openlapp/lapp
        working-directory: lapp-js
        run: node scripts/publish-if-missing.mjs "@openlapp/lapp" "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @openlapp/cli
        working-directory: lapp-js
        run: node scripts/publish-if-missing.mjs "@openlapp/cli" "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
